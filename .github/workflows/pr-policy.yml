# Required check: the PR description follows the workflow in AGENTS.md (tier vs diff, checklist, evidence,
# approved plan for Enhanced+, skills used). Its own workflow so that editing the description re-runs only this.
# It also re-runs on reviews: a plan is approved by a teammate's approving GitHub review (scripts/lib/policy.mjs).
# The description and PR number are passed as data through environment variables, never interpolated into the script.
name: pr-policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: PR author and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-meta.mjs "$PR_NUMBER" "$RUNNER_TEMP/pr-meta.json"
      - name: PR description follows the workflow
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/pr-policy.mjs "$RUNNER_TEMP/pr-body.md" "$RUNNER_TEMP/pr-meta.json"
