[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docproc"
version = "0.1.0"
description = "Bilingual (Arabic/English) policy understanding and version comparison with LangGraph"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf~=2.1.0",  # tests/fixtures/ltr_pdf_page_hashes.json holds exact page text read with 2.1 (MuPDF 1.28.6)
    "mammoth>=1.7",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
st = ["sentence-transformers>=3.0"]
gemma = ["sentence-transformers[image]>=6.1", "torch", "torchvision"]
anthropic = ["anthropic>=0.40"]
ovis = ["transformers>=4.57", "accelerate", "torch", "pillow"]
dev = ["pytest>=8", "python-docx>=1.1", "pillow>=10", "ruff>=0.17", "hypothesis>=6.100"]

[project.scripts]
docproc = "docproc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docproc = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_models: uses real Ollama/BGE-M3/LLM backends (skipped unless configured)",
    "postgres: needs DOCPROC_PG_DSN pointing at PostgreSQL with pgvector",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Lenient start (syntax errors, pyflakes, statement checks); ratchet up per directory over time.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
